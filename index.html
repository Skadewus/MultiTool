<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MultiTool</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="updateNotice" class="update-notice" hidden>
    <span id="updateLabel">Update available</span>
    <button id="updateBtn" type="button">Get update</button>
  </div>
  <p id="status" class="status" role="status">Select two or more keyframes in the timeline, then apply a curve.</p>

  <section class="card graph-card">
    <div class="graph-wrap"><canvas id="graph" aria-label="Curve editor"></canvas></div>
  </section>

  <section class="curve-tools">
    <button id="resetBtn" class="tool" title="Back to the default curve">
      <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4v5h5"/></svg>
      <span>Reset</span>
    </button>
    <button id="randomBtn" class="tool" title="Make a random curve">
      <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.1"/><circle cx="15" cy="15" r="1.1"/><circle cx="12" cy="12" r="1.1"/><circle cx="15" cy="9" r="1.1"/><circle cx="9" cy="15" r="1.1"/></svg>
      <span>Random</span>
    </button>
    <button id="saveBtn" class="tool" title="Save this curve to the preset list">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>Save</span>
    </button>
    <div class="sep" aria-hidden="true"></div>
    <button id="copyBtn" class="tool" title="Copy the ease from the selected keyframes (it shows in the graph, then Save keeps it)">
      <svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <span>Copy</span>
    </button>
    <button id="pasteBtn" class="tool" title="Paste the copied ease onto the selected keyframes">
      <svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="16" rx="2"/><rect x="9" y="3" width="6" height="4" rx="1"/><path d="M9 12h6M9 16h4"/></svg>
      <span>Paste</span>
    </button>
  </section>

  <section class="card actions">
    <button id="applyBtn" class="apply">Apply curve</button>
  </section>

  <section class="presets-wrap">
    <div class="presets-head">
      <span class="lbl">Quick presets</span>
      <span class="head-btns">
        <button id="restoreBtn" class="mini" title="Bring back any deleted default presets" hidden>Restore defaults</button>
        <button id="editBtn" class="mini" title="Delete, rename and reorder presets">
          <svg viewBox="0 0 24 24"><path d="M4 20l1-4.2L16.6 4.2a1.8 1.8 0 0 1 2.5 0l.7.7a1.8 1.8 0 0 1 0 2.5L8.2 19z"/></svg>
          <span id="editTxt">Edit</span>
        </button>
      </span>
    </div>
    <div id="presets" class="presets"></div>
    <div id="moreRow" class="more-row" hidden>
      <button id="moreBtn" class="more"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg><span id="moreTxt"></span></button>
    </div>
  </section>

  <div class="rule"></div>

  <section class="tools">
    <div class="anchor-grid" id="anchorGrid">
      <button class="anc" data-x="0" data-y="0" title="Top left"><svg viewBox="0 0 24 24"><path d="M5 20V10a5 5 0 0 1 5-5h10"/></svg></button>
      <button class="anc" data-x="0.5" data-y="0" title="Top"><svg viewBox="0 0 24 24"><path d="M5 5h14"/></svg></button>
      <button class="anc" data-x="1" data-y="0" title="Top right"><svg viewBox="0 0 24 24"><path d="M4 5h10a5 5 0 0 1 5 5v10"/></svg></button>
      <button class="anc" data-x="0" data-y="0.5" title="Left"><svg viewBox="0 0 24 24"><path d="M5 5v14"/></svg></button>
      <button class="anc" data-x="0.5" data-y="0.5" title="Center"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M12 3v5M12 16v5M3 12h5M16 12h5"/></svg></button>
      <button class="anc" data-x="1" data-y="0.5" title="Right"><svg viewBox="0 0 24 24"><path d="M19 5v14"/></svg></button>
      <button class="anc" data-x="0" data-y="1" title="Bottom left"><svg viewBox="0 0 24 24"><path d="M5 4v10a5 5 0 0 0 5 5h10"/></svg></button>
      <button class="anc" data-x="0.5" data-y="1" title="Bottom"><svg viewBox="0 0 24 24"><path d="M5 19h14"/></svg></button>
      <button class="anc" data-x="1" data-y="1" title="Bottom right"><svg viewBox="0 0 24 24"><path d="M4 19h10a5 5 0 0 0 5-5V4"/></svg></button>
    </div>

    <div class="quick">
      <button class="qbtn" data-task="kfPrecomp"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="1.5"/><rect x="9" y="4" width="12" height="10" rx="1.5"/></svg><span>Pre-comp</span></button>
      <button class="qbtn" data-task="kfCenter"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.5"/><path d="M12 9v6M9 12h6"/></svg><span>Center in comp</span></button>
      <div class="qrow">
        <button class="qbtn" data-task="kfFlip" data-axis="x" title="Mirror the selected layers left to right"><svg viewBox="0 0 24 24"><path d="M12 2.5v19" stroke-dasharray="2 2"/><path d="M6 7v10M6 7h4M6 12h3"/><path d="M18 7v10M18 7h-4M18 12h-3"/></svg><span>H flip</span></button>
        <button class="qbtn" data-task="kfFlip" data-axis="y" title="Mirror the selected layers top to bottom"><svg viewBox="0 0 24 24"><path d="M2.5 12h19" stroke-dasharray="2 2"/><path d="M8 3v7M8 3h6M8 6h4"/><path d="M8 21v-7M8 21h6M8 18h4"/></svg><span>V flip</span></button>
      </div>
    </div>
  </section>

  <section class="layers">
    <span class="lbl">Add layer</span>
    <div class="layer-row">
      <div class="lcell"><button class="lay" data-kind="NUL" title="Null object"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1.5" stroke-dasharray="3 2.4"/><path d="M12 9v6M9 12h6"/></svg><span>Null</span></button></div>
      <div class="lcell"><button class="lay" data-kind="TXT" title="Text layer"><svg viewBox="0 0 24 24"><path d="M6 8V5.5h12V8M12 5.5v13M9 18.5h6"/></svg><span>Text</span></button></div>
      <div class="lcell"><button class="lay" data-kind="SOL" id="solidBtn" title="Solid"><svg viewBox="0 0 24 24"><rect id="solidFill" x="4" y="6" width="16" height="12" rx="1.8"/></svg><span>Solid</span></button><button class="gear" data-kind="SOL" title="Solid settings: opens After Effects' own Solid Settings dialog, adds the layer and remembers its color"><svg viewBox="0 0 24 24"><path d="M10.5 4.7 L10.7 1.9 L13.3 1.9 L13.5 4.7 L16.1 5.8 L18.2 3.9 L20.1 5.8 L18.2 7.9 L19.3 10.5 L22.1 10.7 L22.1 13.3 L19.3 13.5 L18.2 16.1 L20.1 18.2 L18.2 20.1 L16.1 18.2 L13.5 19.3 L13.3 22.1 L10.7 22.1 L10.5 19.3 L7.9 18.2 L5.8 20.1 L3.9 18.2 L5.8 16.1 L4.7 13.5 L1.9 13.3 L1.9 10.7 L4.7 10.5 L5.8 7.9 L3.9 5.8 L5.8 3.9 L7.9 5.8Z"/><circle cx="12" cy="12" r="3.2"/></svg></button></div>
      <div class="lcell"><button class="lay" data-kind="SHP" title="Empty shape layer"><svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.1 5.6.8-4 3.9.9 5.6L12 16.9 7 19.4l.9-5.6-4-3.9 5.6-.8z"/></svg><span>Shape</span></button></div>
      <div class="lcell"><button class="lay" data-kind="CAM" title="Camera"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="12.5" height="10" rx="2"/><path d="M15.5 11l5-3v8l-5-3z"/></svg><span>Camera</span></button><button class="gear" data-kind="CAM" title="Camera settings: opens After Effects' own dialog, then adds the layer"><svg viewBox="0 0 24 24"><path d="M10.5 4.7 L10.7 1.9 L13.3 1.9 L13.5 4.7 L16.1 5.8 L18.2 3.9 L20.1 5.8 L18.2 7.9 L19.3 10.5 L22.1 10.7 L22.1 13.3 L19.3 13.5 L18.2 16.1 L20.1 18.2 L18.2 20.1 L16.1 18.2 L13.5 19.3 L13.3 22.1 L10.7 22.1 L10.5 19.3 L7.9 18.2 L5.8 20.1 L3.9 18.2 L5.8 16.1 L4.7 13.5 L1.9 13.3 L1.9 10.7 L4.7 10.5 L5.8 7.9 L3.9 5.8 L5.8 3.9 L7.9 5.8Z"/><circle cx="12" cy="12" r="3.2"/></svg></button></div>
      <div class="lcell"><button class="lay" data-kind="ADJ" title="Adjustment layer"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" class="knob"/><circle cx="15" cy="12" r="2" class="knob"/><circle cx="8" cy="17" r="2" class="knob"/></svg><span>Adjust</span></button></div>
    </div>
  </section>

  <script src="js/update-config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
